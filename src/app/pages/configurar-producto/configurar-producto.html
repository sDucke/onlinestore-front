<div class="wrap" style="padding-top: 40px; text-align: center; animation: 0.5s ease-out 0s 1 fadeIn; padding-bottom: 80px;">
  <div style="display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 32px; width: 100%;">
    <a routerLink="/publicar" style="position: absolute; left: 0; color: var(--blue-light); text-decoration: none; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: rgba(0,180,216,0.1);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <h2 style="font-size: 24px; margin: 0; font-weight: 800;">Detalle del <span style="color: var(--blue-light);">Producto</span></h2>
  </div>

  <div style="display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-start; justify-content: center;">
    
    <!-- Miniatura (Izquierda) -->
    <div class="glass-panel" style="width: 100%; max-width: 320px; padding: 20px;">
      <h3 style="font-size: 14px; margin-bottom: 16px; color: var(--white-dim); text-transform: uppercase; letter-spacing: 0.05em;">Imagen Base</h3>
      
      @if (previewUrl()) {
        <div style="width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
          <img [src]="previewUrl()" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
      } @else {
        <div style="width: 100%; aspect-ratio: 1; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; flex-direction: column; color: var(--white-dim);">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span style="font-size: 13px;">Sin imagen procesada</span>
        </div>
      }
    </div>

    <!-- Formulario (Derecha) -->
    <div class="glass-panel" style="width: 100%; max-width: 500px; padding: 32px 24px;">
      
      <div class="form-group">
        <label class="form-label">Nombre del Producto *</label>
        <input type="text" name="nombre" class="form-input" placeholder="Ej. iPhone 15 Pro Max 256GB" [ngModel]="nombre()" (ngModelChange)="nombre.set($event)">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group">
          <label class="form-label">Precio ($) *</label>
          <input type="number" name="precio" class="form-input" placeholder="0.00" [ngModel]="precio()" (ngModelChange)="precio.set($event)">
        </div>
        <div class="form-group">
          <label class="form-label">Stock *</label>
          <input type="number" name="cantidad" class="form-input" placeholder="10" [ngModel]="cantidad()" (ngModelChange)="cantidad.set($event)">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Categoría *</label>
        <select class="form-select" name="categoria" [ngModel]="categoria()" (ngModelChange)="categoria.set($event)">
          <option value="" disabled selected>Selecciona una categoría</option>
          <option value="celulares">Celulares y Tablets</option>
          <option value="computadoras">Computadoras y Laptops</option>
          <option value="accesorios">Accesorios y Audio</option>
          <option value="repuestos">Repuestos Generales</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Detalles Adicionales</label>
        <textarea class="form-textarea" name="detalles" placeholder="Describe estado físico, especificaciones extras, marca, etc..." [ngModel]="detalles()" (ngModelChange)="detalles.set($event)"></textarea>
      </div>

      <div style="display: flex; gap: 16px; margin-top: 16px; width: 100%;">
        <button class="btn btn-primary" style="flex: 1; padding: 20px 16px; display: flex; align-items: center; justify-content: center; gap: 8px;" (click)="publicarProducto(true)" [disabled]="isSubmitting()" [style.opacity]="isSubmitting() ? '0.7' : '1'" [style.cursor]="isSubmitting() ? 'not-allowed' : 'pointer'">
          @if (isSubmitting()) {
            <svg style="animation: spin 1s linear infinite;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="2" x2="12" y2="6"></line>
              <line x1="12" y1="18" x2="12" y2="22"></line>
              <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
              <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
              <line x1="2" y1="12" x2="6" y2="12"></line>
              <line x1="18" y1="12" x2="22" y2="12"></line>
              <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
              <line x1="16.24" y1="4.93" x2="19.07" y2="7.76"></line>
            </svg>
            Procesando...
          } @else {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            Generar diseño
          }
        </button>

        <button class="btn btn-secondary" style="flex: 1; padding: 20px 16px; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s;" (click)="publicarProducto(false)" [disabled]="isSubmitting()" [style.opacity]="isSubmitting() ? '0.7' : '1'" [style.cursor]="isSubmitting() ? 'not-allowed' : 'pointer'" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">
          @if (isSubmitting()) {
            <svg style="animation: spin 1s linear infinite;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="2" x2="12" y2="6"></line>
              <line x1="12" y1="18" x2="12" y2="22"></line>
              <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
              <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
              <line x1="2" y1="12" x2="6" y2="12"></line>
              <line x1="18" y1="12" x2="22" y2="12"></line>
              <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
              <line x1="16.24" y1="4.93" x2="19.07" y2="7.76"></line>
            </svg>
            Subiendo...
          } @else {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            Subir producto
          }
        </button>
      </div>

    </div>
  </div>
</div>
